const lessons=[
{id:'ownership',icon:'🏛️',name:'所有權學習館',page:'109–110',color:0x5dbbb8,point:[-12,0,-7],summary:'所有權人可使用、收益、處分其物，並排除他人干涉。民法的「物」分為動產與不動產；我國憲法第 15 條保障人民財產權。',concepts:['權利主體：享有權利的人；權利客體：權利所指向的對象','動產：手機、衣服、電腦等；不動產：土地及其定著物','所有權不是無條件、無限制的權利'],prompt:'請舉出生活中的一項動產及一項不動產，說明你如何分辨。',q:'下列何者屬於不動產？',choices:['手機','土地上的房屋','筆記型電腦'],answer:1,why:'教材說明土地及其定著物屬於不動產；手機、電腦屬於動產。',teach:'先讓學生分類日常物品，再討論「為何所有權受保障，卻仍可能受到限制？」'},
{id:'features',icon:'🏫',name:'物權特性研究院',page:'111–112',color:0xc79df1,point:[-3,0,-11],summary:'所有權具直接支配性、保護絕對性、排他性與優先性。排他性不代表不能共有；同一所有權可以由數人共享。',concepts:['直接支配性：所有權人依法自行決定如何使用、收益、處分','保護絕對性：可向任何人主張所有權','排他性：一物不會有兩個獨立的所有權，但可以共有','優先性：原則上所有權等物權效力優先於債權，仍應注意法律例外'],prompt:'某臺電腦由兩人共同出資購買，為什麼不違反所有權的排他性？',q:'「一個物可以由數人共有」主要說明何者？',choices:['排他性不排斥共有','每個共有人成立互不相干的完整所有權','所有權必須只有一位權利人'],answer:0,why:'教材明確指出「同一個所有權可能由數人共享，即共有」。',teach:'用電腦借用、共同購買、出售決定三例，分組辨識四項特性。'},
{id:'shop',icon:'💻',name:'電腦交易商店',page:'112',color:0xffbc72,point:[7,0,-9],summary:'小辰先與元元約定 5,000 元交易，後來卻以 6,000 元賣給阿庭並交付。教材以此說明：契約債權與已取得的物權不同。',concepts:['買賣契約成立，不等於電腦所有權已移轉','教材案例中：阿庭已受交付而取得物權','元元原先契約上的請求權，不當然使他成為電腦所有權人','小辰違反先前契約可能涉及對元元的契約責任，應另外分析'],prompt:'從元元、阿庭、小辰三人的立場，分別指出權利與可能的爭議。',q:'依教材的電腦交易案例，誰已取得電腦所有權？',choices:['先訂契約的元元','已受交付的阿庭','兩人同時各有一個完整所有權'],answer:1,why:'教材設定阿庭已受交付，因而取得電腦所有權；元元先訂立的契約並非物權。',teach:'三人角色扮演：元元提出契約請求、阿庭主張所有權，小辰說明履約責任。'},
{id:'court',icon:'⚖️',name:'權利救濟法院',page:'113',color:0x83a9f3,point:[13,0,0],summary:'民法第 767 條提供所有物返還、妨害除去、妨害防止三種請求權。應依侵害狀態選擇救濟方法。',concepts:['返還：遭無權占有或侵奪','除去：已存在的所有權妨害','防止：可能發生的所有權妨害'],prompt:'同學拿走你的電腦不還、有人阻擋你使用、有人準備破壞電腦，分別適用哪一類請求？',q:'他人無權拿走你的電腦並拒不歸還，最直接對應？',choices:['所有物返還請求權','妨害防止請求權','不動產登記'],answer:0,why:'無權占有所有物時，所有權人可請求返還。',teach:'以三張不同干擾情境卡讓學生即時舉牌分類，討論「已發生」與「有發生之虞」的區別。'},
{id:'registry',icon:'🏠',name:'地政事務所',page:'114',color:0x81c993,point:[7,0,9],summary:'物權除依法律或習慣外不得創設；依教材一般原則，不動產物權變動須依法登記，動產物權讓與原則上須交付。',concepts:['物權法定主義：物權除依法律或習慣外，不得創設','不動產登記：教材舉房屋買賣，須完成移轉登記','動產交付：教材說明交付為動產物權移轉的公示方法','真實個案仍須檢視法律所定例外'],prompt:'買房已簽約、已付款，卻還沒有登記。依教材的一般原則，是否已完成房屋所有權移轉？',q:'教材中的房屋買賣，要完成所有權移轉，原則上應？',choices:['只要口頭答應','依法辦理移轉登記','只要先住進去'],answer:1,why:'教材說明不動產物權行為原則上以登記為生效要件。',teach:'讓學生比較「電腦交付」與「房屋登記」的不同，繪製移轉程序圖。'},
{id:'river',icon:'🌿',name:'河川公共利益園區',page:'110、114–115',color:0x80caa3,point:[-3,0,11],summary:'所有權受保障，仍須兼顧公共利益。教材以河川污染、建築騎樓作為財產權行使與社會利益調和的案例。',concepts:['財產權並非絕對保障','合法限制應有法律依據，符合必要的正當程序與相關法治要求','河川污染可能對他人與公共環境造成負面影響','騎樓保留行人通行空間，體現私有財產與公共利益調和'],prompt:'若店家把騎樓堆滿商品，你會如何從所有權與公共利益兩個角度討論？',q:'關於所有權與公共利益，下列何者較符合教材？',choices:['只要是私人所有，完全不受限制','所有權可在法律規範下兼顧公共利益','公共利益一律可不經程序剝奪財產'],answer:1,why:'教材指出國家為維護公共利益，須依正當程序及法律規範限制所有權。',teach:'以河川排放廢水與騎樓通行規劃公民審議，請各組提出方案及理由。'},
{id:'forum',icon:'💡',name:'智慧財產論壇',page:'115',color:0xf7cc72,point:[-12,0,7],summary:'教材延伸討論智慧財產權、創作者權益、合理使用和開放原始碼，要求同時思考創作誘因與社會知識共享。',concepts:['智慧財產權涉及無形的創作成果，與有形物的所有權應區分','著作權保障與合理使用須依具體法律規範判斷','開放原始碼允許依授權條件使用、研究、修改與分享','創作者利益與文化傳播、公共利益須取得平衡'],prompt:'製作學校教材時，如何尊重作者權利，又讓更多人取得學習資源？',q:'對於智慧財產權的保障，教材強調哪一個方向？',choices:['永遠禁止其他人使用作品','只保障創作者，不考慮社會','兼顧創作者權益、合理使用與公共利益'],answer:2,why:'教材的「公民論壇」聚焦著作權保障與社會公共利益的調和。',teach:'分組辯論「教材能否公開分享」，區分授權、合理使用、公開授權與開放原始碼。'}
];
const KEY='civic-island-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{done:[],answers:{},notes:{},name:'',score:0}}catch{state={done:[],answers:{},notes:{},name:'',score:0}};state.done=Array.isArray(state.done)?state.done:[];state.answers=state.answers||{};state.notes=state.notes||{};state.score=state.done.length*100;
let current=0,tab='explore',teacher=false,selectedOption=null,tour=false,viewer={select:null,focus:null,home:null,refresh:null,stopTour:null};const el=id=>document.getElementById(id);const save=()=>{state.score=state.done.length*100;localStorage.setItem(KEY,JSON.stringify(state));updateStats();viewer.refresh?.()};const unlocked=i=>teacher||i===0||state.done.includes(lessons[i-1].id)||state.done.includes(lessons[i].id);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const currentLesson=()=>lessons[current];
function updateStats(){el('progressLabel').textContent=`完成 ${state.done.length} / 7 站`;el('scoreLabel').textContent=`任務積分 ${state.done.length*100}`}
function setTab(t){tab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));renderPanel()}
function selectStation(i,focus=true){if(!unlocked(i)){alert('請先完成上一站的挑戰任務，或開啟教師模式。');return}current=i;selectedOption=null;tab='explore';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));renderPanel();if(focus)viewer.focus?.(i)}
function renderPanel(){const d=currentLesson(),done=state.done.includes(d.id),locked=!unlocked(current);let html='';if(tab==='explore'){html=`<span class="tag">第 ${current+1} / 7 站</span><span class="tag">教材頁 ${d.page}</span><h2>${d.icon} ${d.name}</h2><p>${d.summary}</p><h3>🔍 核心知識</h3><ul>${d.concepts.map(c=>`<li>${c}</li>`).join('')}</ul><div class="challenge"><b>💬 探究提問</b><p>${d.prompt}</p><textarea id="note" aria-label="個人探究筆記" placeholder="在這裡寫下自己的想法，內容只儲存在目前的瀏覽器">${safe(state.notes[d.id]||'')}</textarea><button class="btn secondary" id="saveNote">儲存探究筆記</button></div><div class="formrow"><button class="btn" id="toMission">${done?'🔁 複習挑戰':'🧩 前往挑戰'}</button><button class="btn secondary" id="gotoNext" ${current===6||!unlocked(current+1)?'disabled':''}>下一座建築 →</button></div>${teacher?`<div class="teachers"><b>👩‍🏫 教師引導</b><p>${d.teach}</p></div>`:''}`}
